[project]
name = "toto-analyzer"
version = "0.1.0"
description = "Singapore TOTO & 4D analyzer - for entertainment only"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",

    # Database
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",       # SQLite async driver
    "asyncpg>=0.29.0",         # PostgreSQL async driver (for prod)

    # Scraping
    "playwright>=1.41.0",      # JS rendering needed for Singapore Pools
    "selectolax>=0.3.20",      # Fast HTML parser
    "httpx>=0.27.0",

    # Scheduling
    "apscheduler>=3.10.0",

    # Auth (P3)
    "python-jose[cryptography]>=3.3.0",
    "google-auth>=2.28.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",         # Retry logic
    "structlog>=24.1.0",       # Structured logging
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
