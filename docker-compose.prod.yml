# 生产编排：backend (FastAPI + scraper) + caddy (HTTPS + reverse proxy + 静态前端)
#
# 第一次部署:
#   cp .env.prod.example .env.prod    # 编辑 DOMAIN 等
#   cd frontend && npm ci && npm run build && cd ..
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec backend \
#       python scripts/backfill.py --start 3873 --end 4185
#
# 详细文档见 docs/04-DEPLOY.md

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env.prod
    environment:
      # 容器内的 SQLite 路径，与 entrypoint / DATABASE_URL 一致
      DB_PATH: /data/toto.db
    volumes:
      - ./data:/data        # SQLite 持久化到宿主机 ./data/toto.db
    expose:
      - "8000"              # 仅 compose 内部可达，不暴露到宿主机
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    env_file: .env.prod     # 读取 DOMAIN 供 Caddyfile 模板替换
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"       # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
